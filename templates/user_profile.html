{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100..900&family=Raleway:wght@100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Eats</title>
    <link rel="stylesheet" href="{% static 'user_profile_css.css' %}">
    <link rel="stylesheet" href="{% static 'home_page_css.css' %}">
</head>
<body> 
    <header>
        <div class="logo">
            <img src="{% static 'images/dark_theme_logo.png' %}" alt="Campus Eats logo">
        </div>
        <div class="header_nav">
            <nav class="navs">
                <ul>
                    <li><a class="h" href="/home/">Home</a></li>
                    <li><a class="h" href="/contact/">Contact</a></li>
                    <li><a class="h" href="/about/">About</a></li>
                </ul>
            </nav>
        </div>
        <div class="icons">
            <a href="#" id="toggle_theme">
                <img class="cp" id="theme_icon" src="{% static 'images/night_mode.png' %}" 
                    data-light="{% static 'images/night_mode.png' %}" 
                    data-dark="{% static 'images/light_mode.png' %}" alt="Theme icon">
            </a>            
            <a href="/cart/"><img class="cp" src="{% static 'images/cart_png.png' %}" alt="cart icon"></a>
            <div class="profile-container">
                <a href="#" id="profile-trigger">
                    <img class="cp profile-icon" src="{% static 'images/profile_png.png' %}" alt="profile icon">
                </a>
                <div class="dropdown-menu" id="dropdown-menu">
                    <div class="user-info">
                        <span class="username">saiganesh_9</span>
                    </div>
                    <a href="/profile/">My Profile</a>
                    <hr>
                    <form action="/logout/" method="post">
                        {% csrf_token %}
                        <button type="submit" class="logout-btn">LOGOUT</button>
                    </form>
                </div>
            </div> 
        </div>
    </header>


    <div class="abc">
    <div class="container">
        <div class="profile-card">
            <img src="{{ details.user_img.url }}" alt="Profile Picture" class="profile-pic">
            <p class="username_">{{ details.user_name }}</p>
            <p class="email">{{ details.email }}</p>
        </div>
        <div class="form-container">
            <h3>{{ msg }}</h3>
            <h2>Profile details</h2>
            <form method="post" action="/update_profile/">
                {% csrf_token %}
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="firstName" placeholder="{{ details.first_name }}">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="lastName" placeholder="{{ details.last_name }}">
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" maxlength = "10" name="phoneNumber" placeholder="{{ details.phone_number }}">
                </div>
                <div class="form-group">
                    <label>Email ID</label>
                    <input type="email" name="email" placeholder="{{ details.email }}">
                </div>
                <div class="form-group">
                    <label>Branch</label>
                    <input type="text" name="branch" placeholder="{{ details.branch }}">
                </div>
                <div class="form-group">
                    <label>Registered No.</label>
                    <input type="text" name="regno" maxlength="10" placeholder="{{ details.reg_no }}">
                </div>

                <button type="submit" class="save-btn">Update Profile</button>
            </form>
        </div>
    </div>
    </div>
    




    <footer class="footer">
        <div class="footer-container">
            <div class="footer-logo">
                <img src="{% static 'images/dark_theme_logo.png' %}" alt="Campus Eats Logo">
            </div>
            <div class="footer-links">
                <ul>
                    <li><a href="/home/">Home</a></li>
                    <li><a href="/contact/">Contact</a></li>
                    <li><a href="/about/">About</a></li>
                </ul>
            </div>
            <div class="footer-social">
                <a href="#"><img src="{% static 'images/linkedin.png' %}" alt="LinkedIn"></a>
                <a href="#"><img src="{% static 'images/mail.png' %}" alt="Mail"></a>
                <a href="#"><img src="{% static 'images/instagram.png' %}" alt="instagram"></a>
            </div>
            <div class="footer-info">
                <p>&copy; 2025 Campus Eats</p>
                <p>All rights reserved</p>
            </div>
        </div>
    </footer>
    
    <script src="{% static 'home_page_js.js' %}">
        
    </script>
</body>
</html>
